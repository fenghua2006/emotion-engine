name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff coverage

      - name: Lint
        run: ruff check .

      - name: Unit tests + coverage
        run: |
          coverage run -m unittest discover
          coverage report

      - name: L1 golden (current)
        run: python scripts/generate_l1_golden.py --check

      - name: L1 golden (legacy)
        run: python scripts/generate_l1_golden.py --legacy --check

      - name: L2 golden (current)
        run: python scripts/generate_l2_golden.py --check

      - name: L2 golden (legacy)
        run: python scripts/generate_l2_golden.py --legacy --check

      - name: L5 golden (current)
        run: python scripts/generate_l5_tolerance_golden.py --check

      - name: L5 golden (legacy)
        run: python scripts/generate_l5_tolerance_golden.py --legacy --check
